<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="{% static 'css/fee-and-finance-managements.css' %}">
</head>
<body>
    <div class="main">
        <div>
            <h1> Student Fee Management</h1>
        </div>
    </div>
    <div class="d1">
        <form>
            <table class="table">
                <tr>
                    <td><label id="l1">Fee Receipt No</label><input type="text " placeholder="" id="t1"
                            oninput="legend('#l1','#t1')" onfocus="fgchk('#t1')" onfocusout=" flchk('#t1')">
                            <span></span>
                    </td>
                    <td><label id="l2">Admission No</label><input type="text" placeholder=" Admission No" id="t2"
                            oninput="legend('#l2','#t2')" onfocus="fgchk('#t2')" onfocusout=" flchk('#t2')">
                            <span></span>
                    </td>
                    <td colspan='2'><label id="l3">Student Name</label><input type="text" style="text-transform:capitalize ;" placeholder=" Student Name"
                            id="t3" oninput="legend('#l3','#t3')" onfocus="fgchk('#t3')" onfocusout=" flchk('#t3')">
                            <span></span>
                    </td>
                </tr>
                <tr>
                    <td colspan='2'><label id="l4"> Father Name</label><input type="text" style="text-transform:capitalize ;" placeholder="Father Name"
                            id="t4" oninput="legend('#l4','#t4')" onfocus="fgchk('#t4')" onfocusout=" flchk('#t4')">
                            <span></span>
                    </td>
                    <td colspan='2'><label for="" id="l5"> Mother Name</label><input type="text"
                            placeholder=" Mother Name" id='t5' style="text-transform:capitalize ;" oninput="legend('#l5','#t5')" onfocus="fgchk('#t5')" onfocusout=" flchk('#t5')">
                            <span></span>
                        </td>
                </tr>
                <tr>
                    <td><label id="l6">Month Name</label><input type="Month" placeholder="Month Name" id="t6"
                            oninput="legend('#l6','#t6')" onfocus="fgchk('#t6')" onfocusout=" flchk('#t6')">
                            <span></span>
                    </td>
                    <td><label id="l7"> Fee </label><input type="text " placeholder="Fee" id="t7"
                            oninput="legend('#l7','#t7')" onfocus="fgchk('#t7')" onfocusout=" flchk('#t7')">
                            <span></span>
                    </td>
                    <td><label id="l9"> Late Fee</label><input type="text" placeholder=" Late Fee" id="t9"
                        oninput="legend('#l9','#t9')" onfocus="fgchk('#t9')" onfocusout=" flchk('#t9')">
                        <span></span>
                </td>
                <td><label id="l12">Total Amount</label><input type="text" placeholder=" Total Amount" id="t11"
                    oninput="legend('#l12','#t11')" onfocus="fgchk('#t11')" onfocusout=" flchk('#t11')">
                    <span></span>
                </td> 
                </tr>
                <tr>
                    <td><label id="l8">Due Date</label><input type="date" placeholder="Due Date" id="t8"
                        oninput="legend('#l8','#t8')" onfocus="fgchk('#t8')" onfocusout=" flchk('#t8')">
                        <span></span>
                    </td>
                    <td><label id="l10">Pay Date</label><input type="date" placeholder="Pay Date" id="t10"
                            oninput="legend('#l10','#t10')" onfocus="fgchk('#t10')" onfocusout=" flchk('#t10')">
                            <span></span>
                         </td>
                         <td><label for="" id="l15">Pay Amount</label><input type="text" id="t15" placeholder=" Pay Amount" oninput="legend('#l15','#t15')" onfocus="fgchk('#t15')" onfocusout=" flchk('#t15')">
                            <span></span>
                        </td>
                    <td>  
                        <label id="l11"></label>
                        <select id='optionField'>
                            <option selected disabled>----- Select Any Pay Mode -----</option>
                            <option value="two">Phone Pay</option>
                            <option value="three">Google pay</option>
                            <option value="four">Net Banking</option>
                            <option value="five">Cash</option>
                        </select>
                        <span id="validationMessage"></span>
                    </td>
                </tr>
                <tr>
                    <td><label for="" id='l14'>Balance</label><input type="text" placeholder=" Balance" name="" id="t13"
                        oninput="legend('#l14','#t13')" onfocus="fgchk('#t13')" onfocusout=" flchk('#t13')">
                        <span></span>
                </td>
                <td><input type="button" value="🗸 Submit" id="b3"><input type="button"
                    value="&#x21bb;&nbsp; Reset" id="b4"></td>
                {% comment %} <td></td> {% endcomment %}
                </tr>
            </table>
        </form>
    </div>
    </table>
    </div>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="{% static 'js/fee.js' %}"  type="text/javascript"></script>
</body>
</html>
